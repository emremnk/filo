<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Filo Yönetimi</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.css' rel='stylesheet' />
  <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg bg-dark navbar-dark">
  <div class="container">
    <a class="navbar-brand" href="{{ url_for('main.dashboard') }}">Filo Yönetimi</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navMenu">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="{{ url_for('main.vehicles_page') }}">Araçlar</a></li>
        <li class="nav-item"><a class="nav-link" href="{{ url_for('main.drivers_page') }}">Şoförler</a></li>
        <li class="nav-item"><a class="nav-link" href="{{ url_for('main.units_page') }}">Birimler</a></li>
        <li class="nav-item"><a class="nav-link" href="{{ url_for('main.fines_page') }}">Cezalar</a></li>
        <li class="nav-item"><a class="nav-link" href="{{ url_for('main.checks_page') }}">Çekler</a></li>
        <li class="nav-item"><a class="nav-link" href="{{ url_for('main.calendar_page') }}">Takvim</a></li>
        <li class="nav-item"><a class="nav-link" href="{{ url_for('main.today_tasks_page') }}">Bugün Görevleri</a></li>
      </ul>
    </div>
  </div>
</nav>
<div class="container py-4">
  {% block content %}{% endblock %}
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js'></script>
{% block scripts %}{% endblock %}
</body>
</html>
