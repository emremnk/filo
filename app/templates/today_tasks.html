{% extends 'base.html' %}
{% block content %}
<h2>Bugün Görevleri</h2>
<p class="text-muted">Gecikmiş: kırmızı, 7 gün kala: sarı, diğerleri: mavi</p>
<ul class="list-group">
  {% for item in items %}
  <li class="list-group-item list-group-item-{{ item.status }}">{{ item.date }} - {{ item.title }}</li>
  {% else %}
  <li class="list-group-item">Görev yok</li>
  {% endfor %}
</ul>
{% endblock %}
