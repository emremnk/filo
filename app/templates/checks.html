{% extends 'base.html' %}
{% block content %}
<h2>Çekler</h2>
<div class="card shadow-sm mb-4"><div class="card-body">
  <form method="post" class="row g-2">
    <div class="col-md-2"><input type="date" class="form-control" name="due_date" required></div>
    <div class="col-md-2"><input type="number" step="0.01" class="form-control" name="amount" placeholder="Tutar" required></div>
    <div class="col-md-2"><input class="form-control" name="company" placeholder="Firma" required></div>
    <div class="col-md-2"><input type="date" class="form-control" name="received_date" placeholder="Alınan"></div>
    <div class="col-md-2"><input type="date" class="form-control" name="issued_date" placeholder="Verilen"></div>
    <div class="col-md-2"><input type="date" class="form-control" name="payable_date" placeholder="Ödenecek"></div>
    <div class="col-md-12"><button class="btn btn-primary">Ekle</button></div>
  </form>
</div></div>
<table class="table table-striped">
  <thead><tr><th>Vade</th><th>Tutar</th><th>Firma</th><th>Alınan</th><th>Verilen</th><th>Ödenecek</th><th></th></tr></thead>
  <tbody>
    {% for check in checks %}
    <tr><td>{{ check.due_date }}</td><td>{{ check.amount }}</td><td>{{ check.company }}</td><td>{{ check.received_date }}</td><td>{{ check.issued_date }}</td><td>{{ check.payable_date }}</td>
      <td><form method="post" action="{{ url_for('main.check_delete', check_id=check.id) }}"><button class="btn btn-sm btn-danger">Sil</button></form></td></tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
